projects:
  - title: WudFlux
    description: A web-based metaverse application featuring AI-powered professor avatars. Users can interact through audio or text, receiving natural responses to questions and queries in an immersive 3D virtual environment accessible through any browser.
  - title: DebateVerse
    description: A fully autonomous debate system where two AI avatars engage in structured debates on given topics. Features intelligent moderator guidance, reference-supported arguments, and ensures proper engagement between debaters in real-time discussions.
  - title: Real-Time Violence Detection
    description: Real-time violence detection system optimized for edge devices. Collaboration between MBZUAI and Technology Innovation Institute (TII). Deployed on Jetson Nano with model optimization techniques for efficient inference in real-world surveillance applications.
  - title: EmotionVis
    description: Facial Expression Recognition system for monitoring neurological patients like Parkinson's disease, developed at DIP Lab under supervision of Dr. Sajjad, in collaboration with NTNU via the ALAMEDA AI toolkit.
