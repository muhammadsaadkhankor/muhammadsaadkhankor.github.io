projects:
  - title: WudFlux
    description: A web-based metaverse application featuring AI-powered professor avatars. Users can interact through audio or text, receiving natural responses to questions and queries in an immersive 3D virtual environment accessible through any browser.
  - title: DebateVerse
    description: A fully autonomous debate system where two AI avatars engage in structured debates on given topics. Features intelligent moderator guidance, reference-supported arguments, and ensures proper engagement between debaters in real-time discussions.
  - title: Real-Time Violence Detection
    description: Real-time violence detection system optimized for edge devices. Collaboration between Mohamed bin Zayed University of Artificial Intelligence (MBZUAI) and Technology Innovation Institute (TII). Deployed on Jetson Nano with model optimization techniques for efficient inference and resource-constrained deployment in real-world surveillance applications.
  - title: EmotionVis
    description: Facial Expression Recognition system for monitoring neurological patients like Parkinson's disease. Worked on training adaptive models for pain assessment and emotion monitoring under supervision of Dr. Sajjad at DIP Lab, Islamia College Peshawar. NTNU (Norwegian University of Science and Technology) collaboration funded by Alameda AI toolkit.
    links:
      - label: Project
        url: https://alamedaproject.eu/partners/ntnu-norwegian-university-of-science-and-technology/
